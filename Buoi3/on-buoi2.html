<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sample</title>
  </head>
  <body>
    <h1>Đăng kí lịch học</h1>
    <form>
      <ul>
        <li>
          <label for="email"> Địa chỉ email của bạn: </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="phải chứa dấu @"
          />
        </li>
        <li>
          <input type="radio" name="time" id="morning" value="morning" />
          <label for="morning">Sáng</label>
          <input type="radio" name="time" id="afternoon" value="afternoon" />
          <label for="afternoon">Chiều</label>
        </li>
        <button type="submit">Gửi</button>
      </ul>
    </form>
    <table border="1">
      <tr>
        <th rowspan="2">Thứ 2</th>
        <td>Toán11</td>
      </tr>
      <tr>
        <td>Văn</td>
      </tr>
    </table>
  </body>
</html>
